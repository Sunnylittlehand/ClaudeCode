name: Update Ledger Oct 1 (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Oct 1 updates
        env:
          HEADER_B64: ""
          ROW1_B64: ""
          ROW2_B64: ""
          ROW3_B64: ""
        run: |
          python3 << 'PYEOF'
          import base64, os

          header = base64.b64decode(os.environ['HEADER_B64']).decode('utf-8')
          row1   = base64.b64decode(os.environ['ROW1_B64']).decode('utf-8')
          row2   = base64.b64decode(os.environ['ROW2_B64']).decode('utf-8')
          row3   = base64.b64decode(os.environ['ROW3_B64']).decode('utf-8')

          with open('anthropic-research/captured-items.md', 'r', encoding='utf-8') as f:
              content = f.read()

          anchor1 = '> Updated 2026-09-30'
          if anchor1 in content and header not in content:
              content = content.replace(anchor1, header + '\n' + anchor1, 1)
              print('Inserted Oct 1 header entry')
          else:
              print('Header already present or anchor not found — skipping')

          anchor2 = '| OpenAI DevDay 2026 — Dots'
          new_rows = row1 + '\n' + row2 + '\n' + row3 + '\n'
          if anchor2 in content and row1 not in content:
              content = content.replace(anchor2, new_rows + anchor2, 1)
              print('Inserted 3 new table rows')
          else:
              print('Rows already present or anchor not found — skipping')

          with open('anthropic-research/captured-items.md', 'w', encoding='utf-8') as f:
              f.write(content)
          print('Done writing file')
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anthropic-research/captured-items.md
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "No changes to commit — file already up to date"
          else
            git commit -m "Update captured-items.md ledger — add 3 new Oct 1 rows

New rows: OpenAI Moonshot AI distillation disclosure, Claude for Government GA,
OpenAI safety cases paper. Updated 2026-10-01 annotation added.

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01SEdtCgVHtp3AXJsjGKM7ot"
            git push
          fi
