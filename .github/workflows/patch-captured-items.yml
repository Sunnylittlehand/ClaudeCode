name: Patch captured-items 2026-10-04
on:
  push:
    branches: [main]
    paths:
      - 'anthropic-research/patch-trigger-2026-10-04.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch (idempotent)
        run: |
          if grep -q '> Updated 2026-10-04' anthropic-research/captured-items.md; then
            echo 'Patch already applied, skipping.'
          else
            python3 .github/scripts/patch_captured_items.py
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm anthropic-research/patch-trigger-2026-10-04.txt 2>/dev/null || true
          git add anthropic-research/captured-items.md
          if git diff --staged --quiet; then
            echo 'No changes to commit'
          else
            git commit -m "Update captured-items.md: 2026-10-04 session — Investor Day material update"
            git push
          fi
