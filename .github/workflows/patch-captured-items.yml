name: Patch captured-items 2026-10-04
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_captured_items.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anthropic-research/captured-items.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update captured-items.md: 2026-10-04 session — Investor Day material update"
            git push
          fi
